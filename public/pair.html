<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>需要配对 · OfferWhere</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #0f1115; color: #e6e8ee;
    font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 100%; max-width: 380px; background: #171a21; border: 1px solid #262b36;
    border-radius: 14px; padding: 26px 22px 22px;
  }
  h1 { margin: 0 0 6px; font-size: 19px; font-weight: 600; }
  .sub { margin: 0 0 20px; color: #98a1b3; font-size: 13.5px; }
  label { display: block; font-size: 13px; color: #98a1b3; margin-bottom: 7px; }
  input[type=text] {
    width: 100%; padding: 13px 14px; font-size: 22px; letter-spacing: 8px; text-align: center;
    font-variant-numeric: tabular-nums; color: #e6e8ee; background: #0f1115;
    border: 1px solid #2f3646; border-radius: 10px; outline: none;
  }
  input[type=text]:focus { border-color: #4c7dff; }
  button {
    width: 100%; margin-top: 14px; padding: 13px; font-size: 15px; font-weight: 600;
    color: #fff; background: #3b6fe0; border: 0; border-radius: 10px; cursor: pointer;
  }
  button:hover { background: #4c7dff; }
  button:disabled { opacity: .55; cursor: default; }
  .msg { margin-top: 14px; font-size: 13.5px; min-height: 20px; }
  .msg.err { color: #ff8b8b; }
  .msg.ok { color: #6ee7a8; }
  .hint {
    margin: 20px 0 0; padding-top: 16px; border-top: 1px solid #262b36;
    font-size: 12.5px; color: #7d8698;
  }
  .hint b { color: #98a1b3; font-weight: 600; }
  code { background: #0f1115; padding: 1px 5px; border-radius: 4px; font-size: 12px; color: #b9c2d4; }
</style>
</head>
<body>
<div class="card">
  <h1>这台设备需要配对</h1>
  <p class="sub">为了防止同一 Wi-Fi 下的其他人打开控制台，首次访问需要输入一次配对码。</p>

  <label for="code">6 位配对码</label>
  <input id="code" type="text" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="000000" autofocus>
  <button id="go" type="button">配对</button>
  <div class="msg" id="msg"></div>

  <p class="hint">
    <b>配对码在哪？</b><br>
    在运行 OfferWhere 的那台电脑上，看 <b>服务端窗口</b>里 <code>[pair]</code> 那一行；
    也可以打开 <code>data/.pair_code</code> 文件查看。<br><br>
    <b>配对码是一次性的</b>：用过之后会自动换一个新码（换新码后，已配对过的设备不用再配对）。
  </p>
</div>

<script>
(function () {
  var input = document.getElementById('code');
  var btn = document.getElementById('go');
  var msg = document.getElementById('msg');

  function show(text, kind) {
    msg.textContent = text;
    msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  async function submit() {
    var code = String(input.value || '').replace(/\D/g, '');
    if (code.length !== 6) { show('请输入 6 位数字', 'err'); return; }
    btn.disabled = true;
    show('正在配对…');
    try {
      var res = await fetch('/api/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (res.ok && data && data.ok) {
        show('配对成功，正在进入控制台…', 'ok');
        setTimeout(function () { location.replace('/'); }, 500);
        return;
      }
      show((data && data.error) || ('配对失败（HTTP ' + res.status + '）'), 'err');
    } catch (e) {
      show('网络错误：' + ((e && e.message) || e), 'err');
    }
    btn.disabled = false;
    input.select();
  }

  btn.addEventListener('click', submit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  input.addEventListener('input', function () {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
  });
})();
</script>
</body>
</html>
