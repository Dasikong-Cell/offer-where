name: Release

# 目的：把「下载即用」的第一关补上。
# 背景（2026-09-25 开箱实测）：仓库此前**没有任何下载渠道** —— GitHub 与 Gitee
# 均无 Release、无 tag，.github/workflows 只有 ci.yml。接收方只能拿到源码自己跑
# 打包脚本，这不符合「软件商城下载即用」的预期；而且手工产的包不携带版本信息，
# 曾出现「桌面包是整改做到一半的工作树快照、不对应任何提交」的情况，无从追溯。
#
# 本工作流：打 tag -> 跑门禁与测试 -> pack.ps1 打包（内含 version.json）-> 上传到 Release。
#
# 两种触发方式：
#   1) 推 tag（推荐，版本号明确）：git tag v1.0.0 && git push origin v1.0.0
#   2) 手动触发（GitHub 页面 Actions -> Release -> Run workflow）：
#      只给一个「版本号」输入框；**留空会自动生成** v<日期>-<短提交号>。
#      加这条是为了让「产出可下载的包」不必依赖本地环境 —— 本机 pre-push 钩子会跑
#      verify/test，受限环境里可能失败；而打包是 I/O 重的活儿，交给 runner 更合适。
#
# Action 版本策略与 ci.yml 保持一致：checkout / setup-node 用 v5（v5 起运行在 Node 24），
# 用 v4 会触发 GitHub 的 "Node.js 20 is deprecated" 告警。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号，形如 v1.0.0（留空则自动生成 v<日期>-<短提交号>）'
        required: false
        type: string

permissions:
  contents: write   # gh release create 需要

jobs:
  release:
    name: 打包并发布
    runs-on: windows-latest
    # 开关来自**仓库 variable**，不是 secret —— 这是刻意的：如果它跟着 secret 一起走，
    # 那么「删掉 PII_DENYLIST」就会静默退回「跳过扫描」，而这一步本该是最后一道防线。
    # 本 workflow 不带 pull_request 触发，所以不需要 ci.yml 里那个 fork 例外。
    env:
      REQUIRE_PII_SCAN: ${{ vars.REQUIRE_PII_SCAN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # 必须先定 tag：push 事件取 ref，手动触发取输入框（空则自动生成）。
      # gh release create <tag> 在该 tag 不存在时会自动指向默认分支的当前提交。
      - name: 解析发布标签
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = '${{ inputs.tag }}'
            if ([string]::IsNullOrWhiteSpace($tag)) {
              $short = (git rev-parse --short HEAD).Trim()
              $tag = 'v' + (Get-Date -Format 'yyyy.MM.dd') + '-' + $short
            }
          }
          if ($tag -notmatch '^v') { throw "版本号必须以 v 开头（如 v1.0.0），收到：$tag" }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "release tag = $tag"

      - name: 安装依赖
        run: npm ci

      # denylist 住在 data/ 里，而 data/ 被 gitignore ⇒ runner 上永远不存在。
      # 结果就是「保护产物的那道门」恰好在「构建公开产物的那台机器上」静默失效
      # （2026-09-27 读 runner 自己的日志才发现：`PII check: SKIPPED`）。
      # 从仓库 secret 落到磁盘，并置 REQUIRE_PII_SCAN=1 —— 之后缺 denylist 即构建失败，
      # 而不是安静地跳过。secret 未配置时只给 warning 并维持旧行为，不会突然把流水线打红。
      - name: 落 PII denylist（来自仓库 secret）
        shell: pwsh
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PII_DENYLIST)) {
            if ($env:REQUIRE_PII_SCAN -eq '1') {
              Write-Host "::error::REQUIRE_PII_SCAN=1 but the PII_DENYLIST secret is not set -- refusing to build an unscanned artifact"
              Write-Host "[error] fix: add the PII_DENYLIST repository secret (one deny token per line)."
              exit 1
            }
            Write-Host "::warning::repository secret PII_DENYLIST is not set -- this release will NOT be scanned for personal data"
            exit 0
          }
          New-Item -ItemType Directory -Force -Path data | Out-Null
          # WriteAllText defaults to UTF-8 without BOM, which is what pack.ps1 (ReadAllLines)
          # and scripts/pii_guard.ts (readFileSync utf8) both expect.
          [System.IO.File]::WriteAllText((Join-Path $PWD 'data/.pii_denylist.txt'), $env:PII_DENYLIST)
          Write-Host "PII denylist materialised; the pack step now fails closed if the scan cannot run"

      - name: 类型检查 + 控制台语法门禁
        run: npm run verify

      - name: 回归自检 + 合约测试
        run: npm test

      # 仓库里 node/ 被 gitignore（只在打包时需要），CI 里用 runner 自带的 node 顶上
      - name: 准备自带 Node 运行时
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./node | Out-Null
          Copy-Item (Get-Command node).Source ./node/node.exe

      # pack.ps1 自带 fail-closed 断言（必含入口/自带 node/控制台；禁含 .env、data、
      # src、.git、tsc 编译产物），并写入 version.json（提交号 + 构建时间 + 是否脏树）。
      # PACK_ZIP_DIR：显式指定产物目录，不赌 runner 的 Desktop 是否存在/被重定向。
      - name: 打包
        shell: pwsh
        env:
          PACK_ZIP_DIR: ${{ runner.temp }}
        run: |
          ./pack.ps1
          if ($LASTEXITCODE -ne 0) { throw "pack.ps1 failed with $LASTEXITCODE" }
          $zip = Join-Path $env:PACK_ZIP_DIR 'job-apply-agent-portable.zip'
          if (-not (Test-Path $zip)) { throw "pack.ps1 did not produce a zip" }
          Write-Host ("      " + $zip + "  " + [math]::Round((Get-Item $zip).Length / 1MB, 1) + " MB")
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 解压即用冒烟（打包产物本身也验一遍）
        shell: pwsh
        env:
          PACK_ZIP_DIR: ${{ runner.temp }}
        run: |
          # pack_smoke 会重新打包一次，这里用它的断言逻辑验的是同一份 pack.ps1 产物；
          # 若嫌慢可移除本步（ci.yml 每次推 main 都会跑它）。
          ./scripts/pack_smoke.ps1

      # 自解压外壳是**编译产物**（tools/sfx/build/ 被 gitignore），所以每次发布都从
      # tools/sfx/offerwhere_sfx.c 现编译 —— 这样 stub 永远与源码一致，不会出现
      # 「改了 C 忘了重编译，发出去的 exe 还是旧行为」这种只有用户才会撞上的漂移。
      # gcc 是本 job 唯一的工具链依赖；找不到就直接失败，而不是悄悄只发 zip。
      - name: 编译自解压外壳
        shell: pwsh
        run: |
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if (-not $gcc) { $gcc = Get-Command x86_64-w64-mingw32-gcc -ErrorAction SilentlyContinue }
          if (-not $gcc -and (Test-Path 'C:\mingw64\bin\gcc.exe')) { $gcc = Get-Item 'C:\mingw64\bin\gcc.exe' }
          if (-not $gcc) { throw "no MinGW gcc on this runner; cannot build tools/sfx/build/stub.exe" }
          Write-Host ("      gcc: " + $gcc.Source)
          New-Item -ItemType Directory -Force -Path tools/sfx/build | Out-Null
          & $gcc.Source -O2 -mwindows -municode -Wall -o tools/sfx/build/stub.exe tools/sfx/offerwhere_sfx.c -lshell32 -lole32
          if ($LASTEXITCODE -ne 0) { throw "stub build failed with $LASTEXITCODE" }
          Write-Host ("      stub.exe " + (Get-Item tools/sfx/build/stub.exe).Length + " bytes")

      # -SelfTest 会在无人值守模式下真跑一次安装器（解压整包 + 校验外壳落位 + 比对步骤日志），
      # 这是唯一能证明「下载一个文件、双击就能用」的检查；纯结构校验证明不了。
      - name: 构建自解压安装包并端到端自测
        shell: pwsh
        env:
          PACK_ZIP_DIR: ${{ runner.temp }}
        run: |
          $setup = Join-Path $env:PACK_ZIP_DIR 'OfferWhere-Setup.exe'
          ./make_sfx.ps1 -Zip (Join-Path $env:PACK_ZIP_DIR 'job-apply-agent-portable.zip') -Out $setup -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "make_sfx.ps1 failed with $LASTEXITCODE" }
          Write-Host ("      " + $setup + "  " + [math]::Round((Get-Item $setup).Length / 1MB, 1) + " MB")
          "SETUP_PATH=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 上传到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $setupMB = [math]::Round((Get-Item $env:SETUP_PATH).Length / 1MB, 0)
          $zipMB = [math]::Round((Get-Item $env:ZIP_PATH).Length / 1MB, 0)
          # 说明就是使用者下载时看到的第一段字：主推**一个文件**的自解压安装包，zip 作为备用。
          $notes = "## 推荐：双击一个文件就能用`n`n"
          $notes += "下载 **OfferWhere-Setup.exe**（约 $setupMB MB），双击它：`n`n"
          $notes += "1) 弹出安装程序窗口，里面已经填好默认安装位置（%LOCALAPPDATA%\OfferWhere，按用户安装、不需要管理员权限）`n"
          $notes += "   直接点「安装」即可；想装到别处就点「浏览…」选目录，或直接改那个路径`n"
          $notes += "2) 解压完成后自动启动 OfferWhere，第一次启动会弹出「安装」对话框 —— 点「安装」`n"
          $notes += "3) 桌面上出现 OfferWhere 图标，以后双击该图标即可使用`n`n"
          $notes += "解压约需 1.2GB 可用空间（约 12.5 万个文件，需要一到三分钟）。若已装过一次，再双击这个 exe 会直接启动，不会重复解压。`n"
          $notes += "免打扰安装（不弹任何对话框、不启动程序，只解压）：`n"
          $notes += "    OfferWhere-Setup.exe --extract-only`n`n"
          $notes += "## 备用：便携 zip（约 $zipMB MB）`n`n"
          $notes += "1) 解压到纯英文路径（如 D:\offer-where）。建议用系统自带 tar 或 7-Zip；别用资源管理器双击解压（包内 13 万个小文件，会非常慢）：`n"
          $notes += "    mkdir D:\offer-where`n"
          $notes += "    tar -xf job-apply-agent-portable.zip -C D:\offer-where`n"
          $notes += "2) 双击 dist-app\offer-where.exe（原生外壳：自动起后端 + 平台调试窗口；包内自带 Node 运行时，无需另装；需已安装 Google Chrome）`n"
          $notes += "   包内没有 dist-app\offer-where.exe 时（旧包）改双击 start_all.bat，效果等价。`n`n"
          $notes += "## 共同步骤`n`n"
          $notes += "打开控制台窗口（或 http://127.0.0.1:4400/ ），按首页「开箱自检」卡片逐项补齐（上传简历、登录各平台窗口）。`n`n"
          $notes += "首次使用默认只做预览 —— 真实投递会不可撤销地向 HR 发出消息。`n"
          $notes += "包内 version.json 记录了该包对应的提交号与构建时间，可随时核对版本。"
          gh release create $tag "$env:SETUP_PATH" "$env:ZIP_PATH" --title $tag --notes $notes
          Write-Host "release $tag created -> https://github.com/${{ github.repository }}/releases/tag/$tag"
